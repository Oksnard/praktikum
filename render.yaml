services:
  - type: web
    name: praktikum-review
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /_review/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praktikum-review-db
          property: connectionString
      - key: REVIEW_TRUST_RENDER
        value: "true"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
      - key: ALLOW_MOCK_TOPUPS
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: REVIEW_GATE_USER
        sync: false
      - key: REVIEW_GATE_PASSWORD
        sync: false
      - key: REVIEW_ACCOUNTS_JSON
        sync: false
databases:
  - name: praktikum-review-db
    plan: free
    region: frankfurt
    ipAllowList: []
    databaseName: praktikum
    user: praktikum
